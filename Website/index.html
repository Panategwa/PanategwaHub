<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Panategwa Hub</title>
  <link rel="canonical" href="main-pages/home/home-page.html" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet" />
  <!--
    Entry point for https://panategwa.github.io/PanategwaHub/
    The home page lives at main-pages/home/home-page.html, so this file
    forwards visitors there. GitHub Pages serves static files only and has no
    redirect rule, so the forward has to happen in the page itself.
  -->
  <meta http-equiv="refresh" content="0; url=main-pages/home/home-page.html" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121a2c;
      color: #e7edf7;
      font-family: 'Rubik', 'Segoe UI', sans-serif;
      text-align: center;
    }
    a { color: #a5d6ff; }
  </style>
  <script>
    // Replace rather than assign, so Back does not bounce through this stub.
    window.location.replace("main-pages/home/home-page.html");
  </script>
</head>
<body>
  <p>Taking you to the home page&hellip;<br />
    <a href="main-pages/home/home-page.html">Click here if nothing happens</a></p>
</body>
</html>
